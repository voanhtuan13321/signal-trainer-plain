name: "🧪 Tests"

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  # Tests only read the repository.
  contents: read

concurrency:
  # A newer push to the same branch or PR makes older runs pointless.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "🧪 Run Tests"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Source"
        uses: actions/checkout@v6

      - name: "⚙️ Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "🧪 Run Tests"
        run: npm test
