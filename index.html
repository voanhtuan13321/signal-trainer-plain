<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Signal Trainer - học và luyện Morse Code và Flag Semaphore."
  />
  <title>Signal Trainer</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

  <!-- CSS stays framework-free so GitHub Pages can serve the app as plain files. -->
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/layout.css" />
  <link rel="stylesheet" href="./styles/components.css" />
  <link rel="stylesheet" href="./styles/animations.css" />
</head>

<body>
  <a class="skip-link" href="#app">Bỏ qua đến nội dung chính</a>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__row">
        <a class="brand" href="#/">
          <span class="brand__mark">ST</span>

          <span>
            <strong>Signal Trainer</strong>
            <small>Morse & Semaphore</small>
          </span>
        </a>
      </div>

      <nav class="nav" aria-label="Điều hướng chính">
        <a href="#/" data-nav="/"><svg class="nav__icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg><span>Trang chủ</span></a>
        <a href="#/learn" data-nav="/learn"><svg class="nav__icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.5-1.2-3.5-2-6-2H3v14h3c2.5 0 4.5.8 6 2 1.5-1.2 3.5-2 6-2h3V4h-3c-2.5 0-4.5.8-6 2z"/><path d="M12 6v14"/></svg><span>Học</span></a>
        <a href="#/practice" data-nav="/practice"><svg class="nav__icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.8"/></svg><span>Luyện tập</span></a>
        <a href="#/updates" data-nav="/updates"><svg class="nav__icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg><span>Cập nhật</span></a>
      </nav>
    </header>

    <!-- ES modules render the active hash route into this mount point. -->
    <main id="app" class="main" tabindex="-1"></main>

  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
